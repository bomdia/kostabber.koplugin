name: Build Plugin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.1-dev zip
          command -v luac || command -v luac5.1

      - name: Build artifact
        run: make release-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kostabber-release
          path: kostabber.koplugin-*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kostabber.koplugin-*.zip
